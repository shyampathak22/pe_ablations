# RoPE with NTK-aware scaling for length extrapolation
# Reference: https://www.reddit.com/r/LocalLLaMA/comments/14lz7j5/

model:
  vocab_size: 50257
  hidden_dim: 512
  num_layers: 24
  num_heads: 8
  num_kv_heads: 4
  head_dim: 64
  ffn_dim: null
  ffn_multiple_of: 256

  pe_mode: rope
  max_seq_len: 512
  rope_theta: 10000.0
  rope_type: ntk
  rope_scale: 2.0  # Scale factor for NTK interpolation

  norm_eps: 1.0e-6
  use_qk_norm: true
  dropout: 0.0
  tie_embeddings: true
  gradient_checkpointing: false

training:
  learning_rate: 3.0e-4
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  warmup_steps: 1000
  total_tokens: 100000000
  batch_size: 64
  seq_len: 512
  gradient_accumulation_steps: 1
  mixed_precision: bf16
  validation_interval: 500
  validation_samples: 1000
  checkpoint_dir: checkpoints
  checkpoint_interval: 1000
  keep_last_n: 3
  log_interval: 10
  wandb_project: pe-ablations
  wandb_run_name: rope-ntk
  loss_spike_threshold: 10.0
  seed: 42
  gpu_peak_tflops: 23.7

data:
  dataset_name: wikitext
  dataset_config: wikitext-103-raw-v1
  tokenizer_name: gpt2
  data_dir: data/tokenized
  num_workers: 4

distributed:
  backend: nccl
  bucket_cap_mb: 50
  find_unused_parameters: false

evaluation:
  contexts: [512, 1024, 2048, 4096, 8192, 16384]
  benchmarks:
    - passkey
    - niah
