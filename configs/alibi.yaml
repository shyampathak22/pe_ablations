# ALiBi (Attention with Linear Biases)
# Reference: https://arxiv.org/abs/2108.12409
#
# ALiBi adds linear biases to attention scores based on relative position distance.
# No learnable position embeddings - uses fixed slopes per head.
# Known for good length extrapolation properties.

model:
  # Architecture
  vocab_size: 50257  # GPT-2 tokenizer
  hidden_dim: 512
  num_layers: 24
  num_heads: 8
  num_kv_heads: 4  # GQA-4
  head_dim: 64
  ffn_dim: null  # Auto-computed with SwiGLU scaling
  ffn_multiple_of: 256

  # Positional encoding mode
  pe_mode: alibi

  # General positional encoding
  max_seq_len: 512  # Training context length

  # Normalization
  norm_eps: 1.0e-6
  use_qk_norm: true

  # Regularization
  dropout: 0.0  # Modern practice: no dropout

  # Weight tying
  tie_embeddings: true

  # Training mode
  gradient_checkpointing: false

training:
  # Optimization
  learning_rate: 3.0e-4
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  warmup_steps: 1000

  # Batch configuration
  total_tokens: 100000000  # 100M tokens
  batch_size: 8  # Per GPU
  seq_len: 512
  gradient_accumulation_steps: 4

  # Mixed precision
  mixed_precision: bf16

  # Validation
  validation_interval: 50
  validation_samples: 100

  # Checkpointing
  checkpoint_dir: checkpoints/alibi
  checkpoint_interval: 1000
  keep_last_n: 3

  # Logging
  log_interval: 10
  wandb_project: pe-ablations
  wandb_run_name: alibi

  # Robustness
  loss_spike_threshold: 10.0
  seed: 42

  # Hardware (for MFU calculation)
  gpu_peak_tflops: 23.7

data:
  # Dataset
  dataset_name: wikitext
  dataset_config: wikitext-103-raw-v1
  tokenizer_name: gpt2

  # Pre-tokenized data path
  data_dir: data/tokenized

  # DataLoader
  num_workers: 4

# Distributed training
distributed:
  backend: nccl
  bucket_cap_mb: 50
  find_unused_parameters: false

# Evaluation contexts for extrapolation testing (PPL degradation)
evaluation:
  contexts: [512, 1024, 2048, 4096, 8192, 16384]
