# FoPE+PoPE experiment configuration
# Inherits most settings from base_config.yaml but uses FPoPE positional encoding
#
# Usage:
#   python main.py train --config configs/fpope.yaml
#
# Evaluation:
#   python main.py eval --benchmark passkey --context_lengths 512,1024,2048,4096,8192
#   python main.py eval --benchmark niah --context_lengths 512,1024,2048,4096
#   python main.py eval --benchmark ruler --context_lengths 512,1024,2048,4096

model:
  # Architecture (same as base)
  vocab_size: 50257  # GPT-2 tokenizer
  hidden_dim: 512
  num_layers: 24
  num_heads: 8
  num_kv_heads: 4  # GQA-4
  head_dim: 64
  ffn_dim: null  # Auto-computed with SwiGLU scaling
  ffn_multiple_of: 256

  # Use FoPE+PoPE positional encoding
  pe_mode: fpope

  # Training context length
  max_seq_len: 512

  # FoPE+PoPE hyperparameters
  fpope_theta: 10000.0           # Base frequency (same as RoPE default)
  fpope_num_fourier_terms: 64    # Number of Fourier terms D
  fpope_sigma: 0.4               # Fourier coefficient initialization variance
  fpope_training_length: 512     # Floor frequency = 2pi/512 (must match max_seq_len)
  fpope_delta_init: zero         # Zero init for length generalization

  # Normalization
  norm_eps: 1.0e-6
  use_qk_norm: true

  # Regularization
  dropout: 0.0  # Modern practice: no dropout

  # Weight tying
  tie_embeddings: true

  # Training mode
  gradient_checkpointing: false

training:
  # Optimization
  learning_rate: 3.0e-4
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  warmup_steps: 1000

  # Batch configuration
  total_tokens: 100000000  # 100M tokens
  batch_size: 64  # Per GPU
  seq_len: 512
  gradient_accumulation_steps: 1

  # Mixed precision
  mixed_precision: bf16

  # Validation
  validation_interval: 500
  validation_samples: 1000

  # Checkpointing
  checkpoint_dir: checkpoints
  checkpoint_interval: 1000
  keep_last_n: 3

  # Logging
  log_interval: 10
  wandb_project: pe-ablations
  wandb_run_name: fpope-base  # Specific run name for FPoPE experiment

  # Robustness
  loss_spike_threshold: 10.0
  seed: 42

  # Hardware (for MFU calculation)
  gpu_peak_tflops: 23.7

data:
  # Dataset
  dataset_name: wikitext
  dataset_config: wikitext-103-raw-v1
  tokenizer_name: gpt2

  # Pre-tokenized data path
  data_dir: data/tokenized

  # DataLoader
  num_workers: 4

# Distributed training
distributed:
  backend: nccl
  bucket_cap_mb: 50
  find_unused_parameters: false

# Evaluation contexts for length generalization testing
# Key experiment: trained on 512, evaluated at longer lengths
evaluation:
  contexts: [512, 1024, 2048, 4096, 8192, 16384]
  benchmarks:
    - passkey  # Find hidden passkey in long context
    - niah     # Needle-in-a-haystack retrieval
    - ruler    # RULER benchmark for extended context
