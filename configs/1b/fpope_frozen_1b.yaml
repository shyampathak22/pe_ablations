# FPoPE frozen - 1B token run
# Extended training for definitive comparison

model:
  vocab_size: 50257
  hidden_dim: 512
  num_layers: 24
  num_heads: 8
  num_kv_heads: 4
  head_dim: 64
  ffn_dim: null
  ffn_multiple_of: 256
  pe_mode: fpope
  max_seq_len: 512
  fpope_theta: 10000.0
  fpope_num_fourier_terms: 64
  fpope_sigma: 0.4
  fpope_training_length: 512
  fpope_delta_init: zero
  fpope_d_rope: 32
  fpope_freeze_coeffs: true
  fpope_use_ceiling: false
  fpope_normalize_coeffs: true
  norm_eps: 1.0e-6
  use_qk_norm: true
  dropout: 0.0
  tie_embeddings: true
  gradient_checkpointing: false

training:
  learning_rate: 3.0e-4
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  warmup_steps: 2000
  total_tokens: 1000000000  # 1B tokens (10x)
  batch_size: 16
  seq_len: 512
  gradient_accumulation_steps: 2
  mixed_precision: bf16
  validation_interval: 100
  validation_samples: 100
  checkpoint_dir: checkpoints/1b/fpope_frozen_1b
  checkpoint_interval: 2000
  keep_last_n: 3
  log_interval: 10
  wandb_project: pe-ablations-1b
  wandb_run_name: fpope-frozen-1b
  loss_spike_threshold: 10.0
  seed: 42
  gpu_peak_tflops: 23.7

data:
  dataset_name: wikitext
  dataset_config: wikitext-103-raw-v1
  tokenizer_name: gpt2
  data_dir: data/tokenized
  num_workers: 4

distributed:
  backend: nccl
  bucket_cap_mb: 50
  find_unused_parameters: false

evaluation:
  contexts: [512, 1024, 2048, 4096, 8192, 16384]
