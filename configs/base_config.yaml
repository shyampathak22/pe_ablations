# Base configuration for PE ablations training
# ~100M parameter model for positional embedding extrapolation experiments

model:
  # Architecture
  vocab_size: 50257  # GPT-2 tokenizer
  hidden_dim: 512
  num_layers: 24
  num_heads: 8
  num_kv_heads: 4  # GQA-4
  head_dim: 64
  ffn_dim: null  # Auto-computed with SwiGLU scaling
  ffn_multiple_of: 256

  # Positional encoding
  max_seq_len: 512  # Training context length
  rope_theta: 10000.0
  rope_type: standard  # standard, ntk, yarn
  rope_scale: 1.0

  # Normalization
  norm_eps: 1.0e-6
  use_qk_norm: true

  # Regularization
  dropout: 0.0  # Modern practice: no dropout

  # Weight tying
  tie_embeddings: true

  # Training mode
  gradient_checkpointing: false  # Enable if OOM at 512 seq len

training:
  # Optimization
  learning_rate: 3.0e-4
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  warmup_steps: 1000

  # Batch configuration
  total_tokens: 100000000  # 100M tokens
  batch_size: 64  # Per GPU
  seq_len: 512
  gradient_accumulation_steps: 1

  # Mixed precision
  mixed_precision: bf16  # bf16 for Blackwell

  # Validation
  validation_interval: 500
  validation_samples: 1000

  # Checkpointing
  checkpoint_dir: checkpoints
  checkpoint_interval: 1000
  keep_last_n: 3

  # Logging
  log_interval: 10
  wandb_project: pe-ablations
  wandb_run_name: null  # Auto-generated if null

  # Robustness
  loss_spike_threshold: 10.0
  seed: 42

  # Hardware (for MFU calculation)
  # RTX 5060 Ti: 23.7 TFLOPS FP16
  gpu_peak_tflops: 23.7

data:
  # Dataset
  dataset_name: wikitext
  dataset_config: wikitext-103-raw-v1
  tokenizer_name: gpt2

  # Pre-tokenized data path
  data_dir: data/tokenized

  # DataLoader
  num_workers: 4

# Distributed training
distributed:
  backend: nccl
  bucket_cap_mb: 50
  find_unused_parameters: false

# Evaluation contexts for extrapolation testing
evaluation:
  contexts: [1024, 2048, 4096, 8192, 16384]
  benchmarks:
    - passkey
    - niah
