[build-system]
requires = ["setuptools>=61.0", "wheel", "torch>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pe-ablations"
version = "0.1.0"
description = "Modern transformer base model for positional embedding extrapolation experiments"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.9.1",
    "numpy",
    "einops",
    "transformers",
    "wandb",
    "pyyaml",
    "tqdm",
    "datasets",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff",
]
cuda = []  # CUDA extension built via setup.py

# CUDA Requirements for Blackwell GPUs (RTX 50xx series):
# - CUDA 12.8+ installed at /usr/local/cuda-12.8
# - Set environment before building:
#     export CUDA_HOME=/usr/local/cuda-12.8
#     export PATH=$CUDA_HOME/bin:$PATH
# - Use launcher scripts: ./scripts/run_training.sh <config_name>

[project.scripts]
train = "scripts.train:main"
evaluate = "scripts.evaluate:main"
benchmark = "scripts.benchmark:main"

[tool.setuptools]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
